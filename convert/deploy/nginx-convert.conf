# Add inside your existing server { ... } block for augustserver.com.
# The tool then lives at https://augustserver.com/convert/

location = /convert {
    return 301 /convert/;
}

location /convert/ {
    proxy_pass http://127.0.0.1:8063/;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Keep in sync with MAX_UPLOAD_MB in .env
    client_max_body_size 500M;

    # Large uploads + WAV downloads need generous timeouts
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_request_buffering off;
}
