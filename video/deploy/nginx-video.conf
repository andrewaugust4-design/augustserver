# Add inside your existing server { ... } block for augustserver.com.
# The tool then lives at https://augustserver.com/video/

location = /video {
    return 301 /video/;
}

location /video/ {
    proxy_pass http://127.0.0.1:8064/;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Multi-GB MP4 downloads on slow connections need generous timeouts
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
    proxy_buffering off;
}
