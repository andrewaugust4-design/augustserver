# Add inside your existing server { ... } block for augustserver.com.
# The tool then lives at https://augustserver.com/imagetools/

location = /imagetools {
    return 301 /imagetools/;
}

location /imagetools/ {
    proxy_pass http://127.0.0.1:8061/;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Keep in sync with MAX_UPLOAD_MB in .env
    client_max_body_size 25M;

    # First request downloads the model; don't let nginx time it out
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}
