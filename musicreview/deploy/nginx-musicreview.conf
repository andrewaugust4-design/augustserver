# Add these blocks inside your existing `server { ... }` for augustserver.com.
# The app then lives at https://augustserver.com/musicreview/

# Redirect the bare path to the trailing-slash form so relative URLs resolve.
location = /musicreview {
    return 301 /musicreview/;
}

location /musicreview/ {
    # Trailing slash on proxy_pass strips the /musicreview/ prefix,
    # so the app itself only ever sees "/".
    proxy_pass http://127.0.0.1:8060/;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Audio uploads — keep in sync with MAX_UPLOAD_MB in .env
    client_max_body_size 100M;

    # Whisper on CPU can be slow; don't let nginx kill long polls/uploads
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
}
