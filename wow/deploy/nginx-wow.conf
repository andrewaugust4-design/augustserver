# Add these blocks inside your existing `server { ... }` for augustserver.com.
# The app then lives at https://augustserver.com/wow/

location = /wow {
    return 301 /wow/;
}

# Optional: serve the zone map PNGs (from `python -m ingest.maps`) straight
# from disk instead of through the app. Longest prefix wins, so this takes
# /wow/maps/ ahead of the proxy block below. Without it the app serves them.
location /wow/maps/ {
    alias /opt/wow/data/maps/;
    expires 30d;
    add_header Cache-Control "public";
}

location /wow/ {
    # Trailing slash on proxy_pass strips the /wow/ prefix, so the app
    # itself only ever sees "/".
    proxy_pass http://127.0.0.1:8065/;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # No uploads — plain JSON/API traffic, default timeouts are fine.
}
