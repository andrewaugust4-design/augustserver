# Add these blocks inside your existing `server { ... }` for augustserver.com.
# The app then lives at https://augustserver.com/wow/

location = /wow {
    return 301 /wow/;
}

location /wow/ {
    # Trailing slash on proxy_pass strips the /wow/ prefix, so the app
    # itself only ever sees "/".
    proxy_pass http://127.0.0.1:8065/;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # No uploads — plain JSON/API traffic, default timeouts are fine.
}
