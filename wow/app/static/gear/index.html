<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>document.write('<base href="' + location.pathname.replace(/gear\/.*$/, '') + 'gear/">');</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gear Browser — WoW: Forever</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1b160e;
    --panel: #251e12;
    --panel-edge: #3d331d;
    --ink: #f0e6d2;
    --ink-dim: #a89878;
    --gold: #e0a82e;
    --gold-dim: #8a6b1f;
    --alert: #e2604c;
    --ok: #8fc79a;
    --new: #34d399;
    --changed: #e0a82e;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
    --sans: "Space Grotesk", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    min-height: 100vh;
    padding: 2rem 1.25rem 4rem;
  }
  .wrap { max-width: 920px; margin: 0 auto; }

  .back-link {
    display: inline-flex; align-items: center; gap: 0.45rem;
    font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--ink-dim); text-decoration: none;
    border: 1px solid var(--panel-edge); border-radius: 6px;
    padding: 0.45rem 0.85rem; margin-bottom: 1.25rem;
    transition: color 0.15s, border-color 0.15s;
  }
  .back-link:hover { color: var(--gold); border-color: var(--gold); }

  h1 { font-size: clamp(1.6rem, 4vw, 2.1rem); font-weight: 700; letter-spacing: -0.01em; margin-bottom: 0.9rem; }
  h1 .accent { color: var(--gold); }

  .banner {
    background: rgba(224, 168, 46, 0.08);
    border: 1px solid rgba(224, 168, 46, 0.35);
    border-radius: 10px;
    padding: 0.75rem 1rem;
    margin-bottom: 1.5rem;
    font-size: 0.78rem;
    line-height: 1.55;
  }
  .banner strong { color: var(--gold); }
  .banner .meta-line { display: block; margin-top: 0.3rem; font-family: var(--mono); font-size: 0.68rem; color: var(--ink-dim); }

  section { margin-bottom: 1.5rem; }
  .section-label {
    font-family: var(--mono); font-size: 0.68rem; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--ink-dim); margin-bottom: 0.6rem;
  }

  /* class picker */
  .class-row { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  .class-btn {
    font-family: var(--sans); font-size: 0.85rem; font-weight: 500;
    padding: 0.5rem 0.9rem; border-radius: 8px; cursor: pointer;
    background: var(--panel); border: 1px solid var(--panel-edge); color: var(--ink);
    transition: border-color 0.15s, transform 0.1s;
  }
  .class-btn:hover { transform: translateY(-1px); }
  .class-btn.active { border-color: var(--class-color, var(--gold)); box-shadow: 0 0 0 1px var(--class-color, var(--gold)) inset; }
  .class-swatch { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 0.45rem; background: var(--class-color); }

  /* paperdoll */
  .paperdoll { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem 1.2rem; }
  .paperdoll-col { display: flex; flex-direction: column; gap: 0.5rem; }
  .weapon-row { grid-column: 1 / -1; display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.4rem; padding-top: 0.6rem; border-top: 1px solid var(--panel-edge); }
  .slot-btn {
    font-family: var(--mono); font-size: 0.76rem; text-align: left;
    padding: 0.55rem 0.8rem; border-radius: 8px; cursor: pointer;
    background: var(--panel); border: 1px solid var(--panel-edge); color: var(--ink-dim);
    transition: border-color 0.15s, color 0.15s;
  }
  .slot-btn:hover { color: var(--ink); border-color: var(--gold-dim); }
  .slot-btn.active { color: var(--gold); border-color: var(--gold); }
  .weapon-row .slot-btn { flex: 1; min-width: 120px; }
  .slot-btn { display: flex; align-items: center; gap: 0.6rem; }
  .slot-btn .slot-text { display: flex; flex-direction: column; min-width: 0; }
  .slot-btn .slot-item { font-family: var(--sans); font-size: 0.74rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* item icons: placeholder shows underneath while loading / when missing */
  .icon {
    flex: none; width: 32px; height: 32px; border-radius: 5px;
    border: 2px solid var(--q, var(--panel-edge));
    background: url(../icon-placeholder.svg) center / cover;
    box-shadow: 0 0 6px -2px var(--q, transparent);
    object-fit: cover;
  }
  .icon.lg { width: 48px; height: 48px; border-radius: 7px; }
  .detail-head { display: flex; align-items: center; gap: 0.8rem; margin-bottom: 0.9rem; }
  .detail-head .detail-meta { margin-bottom: 0; }

  /* item list */
  .item-list { display: flex; flex-direction: column; gap: 0.35rem; }
  .item-row {
    display: flex; align-items: center; gap: 0.6rem;
    padding: 0.5rem 0.7rem; border-radius: 8px;
    background: var(--panel); border: 1px solid var(--panel-edge);
  }
  .item-name { background: none; border: none; padding: 0; cursor: pointer; font-family: var(--sans); font-size: 0.88rem; font-weight: 500; text-align: left; }
  .item-name:hover { text-decoration: underline; }
  .item-ilvl { font-family: var(--mono); font-size: 0.7rem; color: var(--ink-dim); }
  .badge {
    font-family: var(--mono); font-size: 0.62rem; letter-spacing: 0.05em; text-transform: uppercase;
    padding: 0.15rem 0.45rem; border-radius: 999px; border: 1px solid transparent; cursor: default;
  }
  .badge.new { color: var(--new); border-color: var(--new); background: rgba(52,211,153,0.1); }
  .badge.changed { color: var(--changed); border-color: var(--changed); background: rgba(224,168,46,0.12); cursor: pointer; }
  .badge.changed:hover { background: rgba(224,168,46,0.22); }
  .empty-note, .hint-note { font-size: 0.85rem; color: var(--ink-dim); padding: 0.75rem 0; }

  /* detail panel */
  .detail-panel {
    background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 12px;
    padding: 1.1rem 1.3rem;
  }
  .detail-back {
    background: none; border: none; color: var(--ink-dim); font-family: var(--mono);
    font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer;
    padding: 0; margin-bottom: 0.8rem;
  }
  .detail-back:hover { color: var(--gold); }
  .detail-name { font-size: 1.15rem; font-weight: 600; margin-bottom: 0.2rem; }
  .detail-meta { font-family: var(--mono); font-size: 0.72rem; color: var(--ink-dim); margin-bottom: 0.9rem; }
  .stat-list { list-style: none; margin-bottom: 1rem; }
  .stat-list li { font-size: 0.85rem; padding: 0.15rem 0; }
  .stat-list li.armor { color: var(--ink); }
  .stat-list li.equip { color: var(--ok); }
  .stat-list li.unknown { color: var(--ink-dim); }
  .obtain-box {
    font-size: 0.82rem; color: var(--ink-dim); background: rgba(255,255,255,0.03);
    border: 1px solid var(--panel-edge); border-radius: 8px; padding: 0.7rem 0.9rem; margin-bottom: 0.9rem;
    line-height: 1.5;
  }
  .wowhead-link { font-family: var(--mono); font-size: 0.78rem; color: var(--gold); text-decoration: none; }
  .wowhead-link:hover { text-decoration: underline; }

  /* changed modal */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    display: flex; align-items: center; justify-content: center; padding: 1.25rem; z-index: 50;
  }
  .modal-overlay.hidden { display: none; }
  .modal-box {
    background: var(--panel); border: 1px solid var(--gold-dim); border-radius: 12px;
    padding: 1.3rem 1.5rem; max-width: 560px; width: 100%; max-height: 80vh; overflow-y: auto;
  }
  .modal-title { font-size: 1rem; font-weight: 600; margin-bottom: 0.9rem; }
  .modal-close {
    float: right; background: none; border: none; color: var(--ink-dim); cursor: pointer; font-size: 1.1rem;
  }
  .diff-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 1rem; font-size: 0.82rem; }
  .diff-col-head { font-family: var(--mono); font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-dim); padding-bottom: 0.4rem; border-bottom: 1px solid var(--panel-edge); margin-bottom: 0.5rem; }
  .diff-field { padding: 0.35rem 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
  .diff-field-name { font-family: var(--mono); font-size: 0.65rem; color: var(--ink-dim); text-transform: uppercase; letter-spacing: 0.04em; }

  /* ── set builder ── */
  .char-row { display: flex; flex-wrap: wrap; gap: 0.6rem 1rem; align-items: flex-end; }
  .field { display: flex; flex-direction: column; gap: 0.3rem; }
  .field label { font-family: var(--mono); font-size: 0.64rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-dim); }
  select, input[type=number] {
    font-family: var(--sans); font-size: 0.85rem; color: var(--ink); background: var(--panel);
    border: 1px solid var(--panel-edge); border-radius: 8px; padding: 0.45rem 0.6rem;
  }
  input[type=number] { width: 5rem; }
  .btn {
    font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase;
    padding: 0.55rem 0.9rem; border-radius: 8px; cursor: pointer;
    background: rgba(224,168,46,0.12); border: 1px solid var(--gold-dim); color: var(--gold);
  }
  .btn:hover { border-color: var(--gold); }
  .btn.ghost { background: none; color: var(--ink-dim); border-color: var(--panel-edge); }
  .share-box { display: none; margin-top: 0.7rem; font-family: var(--mono); font-size: 0.75rem; }
  .share-box.show { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
  .share-box input { flex: 1; min-width: 14rem; font-family: var(--mono); font-size: 0.75rem; color: var(--ink);
    background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 6px; padding: 0.4rem 0.5rem; }
  .toast { font-size: 0.8rem; color: var(--alert); min-height: 1.1rem; margin-top: 0.5rem; }

  .builder { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 1.2rem; align-items: start; }
  @media (max-width: 760px) { .builder { grid-template-columns: 1fr; } }
  .slot-btn { position: relative; width: 100%; }
  .slot-btn .slot-label { font-size: 0.64rem; letter-spacing: 0.06em; text-transform: uppercase; }
  .slot-btn .slot-empty { font-family: var(--sans); font-size: 0.74rem; color: var(--ink-dim); opacity: 0.6; }
  .slot-btn.warn { border-color: rgba(226,96,76,0.7); }
  .slot-btn .warn-mark { color: var(--alert); margin-left: auto; font-size: 0.8rem; }
  .slot-btn .unequip { margin-left: auto; color: var(--ink-dim); padding: 0 0.2rem; font-size: 0.85rem; }
  .slot-btn .unequip:hover { color: var(--alert); }
  .slot-btn .warn-mark + .unequip { margin-left: 0.3rem; }
  .unavailable-icon { opacity: 0.35; filter: grayscale(1); }

  .sheet { background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 12px; padding: 1rem 1.1rem; font-size: 0.82rem; }
  .sheet h3 { font-family: var(--mono); font-size: 0.66rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-dim); margin: 0.9rem 0 0.4rem; font-weight: 500; }
  .sheet h3:first-child { margin-top: 0; }
  .sheet .row { display: flex; justify-content: space-between; padding: 0.12rem 0; }
  .sheet .row .v { font-family: var(--mono); }
  .sheet .row .v.gear { color: var(--ok); }
  .sheet .note { font-size: 0.72rem; color: var(--ink-dim); line-height: 1.45; margin-top: 0.35rem; }
  .sheet .prov { font-size: 0.74rem; color: var(--gold); background: rgba(224,168,46,0.08); border: 1px solid rgba(224,168,46,0.3); border-radius: 6px; padding: 0.4rem 0.55rem; margin-bottom: 0.6rem; }
  .sheet .estimated { color: var(--gold); text-transform: none; letter-spacing: 0; font-family: var(--sans); font-size: 0.72rem; }
  .flag { font-family: var(--mono); font-size: 0.62rem; padding: 0.1rem 0.4rem; border-radius: 999px; border: 1px solid var(--alert); color: var(--alert); }
  .flag.dim { border-color: var(--panel-edge); color: var(--ink-dim); }
  .item-row.equipped { border-color: var(--gold); }
  .item-row .info-btn { margin-left: auto; background: none; border: 1px solid var(--panel-edge); color: var(--ink-dim); border-radius: 6px; cursor: pointer; font-family: var(--mono); font-size: 0.66rem; padding: 0.15rem 0.45rem; }
  .item-row .info-btn:hover { color: var(--gold); border-color: var(--gold); }
  .slot-issues { font-size: 0.78rem; color: var(--alert); margin-bottom: 0.6rem; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back-link" href="..">‹ WoW: Forever</a>
  <h1>Gear <span class="accent">Browser</span></h1>
  <div class="banner" id="banner">Loading build info…</div>

  <section>
    <div class="section-label">Class</div>
    <div class="class-row" id="classRow"></div>
  </section>

  <section id="charSection" style="display:none;">
    <div class="char-row">
      <div class="field"><label for="raceSelect">Race</label><select id="raceSelect"></select></div>
      <div class="field"><label for="levelInput">Level</label><input id="levelInput" type="number" min="1" max="60" value="60"></div>
      <button class="btn" id="saveBtn">Save &amp; share</button>
      <button class="btn ghost" id="clearBtn">Clear gear</button>
    </div>
    <div class="share-box" id="shareBox">
      <input id="shareUrl" readonly aria-label="Share link"><button class="btn ghost" id="copyBtn">Copy</button>
    </div>
    <div class="toast" id="toast"></div>
  </section>

  <section id="builderSection" style="display:none;">
    <div class="builder">
      <div>
        <div class="section-label">Equipped — click a slot to browse</div>
        <div class="paperdoll" id="paperdoll"></div>
      </div>
      <div>
        <div class="section-label">Character</div>
        <div class="sheet" id="sheet">—</div>
      </div>
    </div>
  </section>

  <section id="resultsSection" style="display:none;">
    <div class="section-label" id="resultsLabel">Items</div>
    <div id="results"></div>
  </section>
</div>

<div class="modal-overlay hidden" id="modalOverlay">
  <div class="modal-box">
    <button class="modal-close" id="modalClose" aria-label="Close">✕</button>
    <div class="modal-title" id="modalTitle">Changed vs Classic Era</div>
    <div class="diff-grid" id="modalBody"></div>
  </div>
</div>

<script>
const QUALITY_COLORS = {0:'#9d9d9d',1:'#ffffff',2:'#1eff00',3:'#0070dd',4:'#a335ee',5:'#ff8000',6:'#e6cc80',7:'#00ccff'};
const PLACEHOLDER_ICON = '../icon-placeholder.svg';
const INVTYPE_ONE_HAND = 13;

// The loadout is the single source of truth: { class, race, level, slots: {slot: itemId} }.
// `equipped` caches item summaries by slot for rendering; the sheet endpoint
// recomputes stats and per-slot issues from ids after every change.
const state = {
  classes: [], chars: null, slotDefs: [],
  loadout: { class: null, race: null, level: 60, slots: {} },
  equipped: {}, issues: {},
  selectedSlot: null, listItems: [],
  savedId: null, dirty: false,
};

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Self-hosted icon (see /api/icon) with a quality-colored frame. Lazy so a
// long slot list doesn't fire hundreds of requests at once.
function iconImg(id, quality, size = '', extraClass = '') {
  const q = QUALITY_COLORS[quality];
  const src = id ? `../api/icon/${id}.jpg` : PLACEHOLDER_ICON;
  return `<img class="icon ${size} ${extraClass}" src="${src}" alt="" loading="lazy" style="${q ? '--q:' + q : ''}" ` +
         `onerror="this.onerror=null;this.src='${PLACEHOLDER_ICON}'">`;
}

async function api(path, body) {
  const opts = body === undefined ? {} : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) };
  const res = await fetch('../api/' + path, opts);
  if (!res.ok) {
    const detail = (await res.json().catch(() => ({}))).detail;
    throw new Error(typeof detail === 'string' ? detail : res.statusText);
  }
  return res.json();
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg || '';
}

// ── tooltip helpers (unchanged from the browser) ────────────────────────────
const STAT_CATEGORY_ORDER = { primary: 0, resistance: 1, equip: 2 };

function statLine(s) {
  if (s.value === null || s.value === undefined) return `${s.name}: value not yet known`;
  const text = `${s.value >= 0 ? '+' : ''}${s.value} ${s.name}`;
  return s.category === 'equip' ? `Equip: ${text}` : text;
}

function statItems(stats) {
  return [...stats]
    .sort((a, b) => (STAT_CATEGORY_ORDER[a.category] ?? 2) - (STAT_CATEGORY_ORDER[b.category] ?? 2))
    .map(s => {
      const cls = s.value === null || s.value === undefined ? 'unknown' : (s.category === 'equip' ? 'equip' : '');
      return `<li class="${cls}">${statLine(s)}</li>`;
    }).join('');
}

function renderBanner(meta) {
  const el = document.getElementById('banner');
  const refreshed = meta.refreshed_at ? new Date(meta.refreshed_at).toUTCString().replace('GMT', 'UTC') : 'unknown';
  el.innerHTML =
    `<strong>Beta data</strong> — datamined from Forever build ${meta.forever_build} vs Classic Era ${meta.classic_era_build}. ` +
    `Anything here may change before the Nov 4 launch. Stat values are computed from Forever's stat budgets` +
    (meta.stat_match_rate ? ` (cross-checked: ${(meta.stat_match_rate * 100).toFixed(1)}% of ${meta.stat_match_sample} stats on unchanged items match Classic Era)` : '') +
    `; how to obtain items isn't datamined.` +
    `<span class="meta-line">${meta.item_count} items · ${meta.new_count} new · ${meta.changed_count} changed · refreshed ${refreshed}</span>`;
}

// ── class / race / level ────────────────────────────────────────────────────
function renderClasses() {
  const row = document.getElementById('classRow');
  row.innerHTML = state.classes.map(c => `
    <button class="class-btn" style="--class-color:${c.color}" data-slug="${c.slug}">
      <span class="class-swatch"></span>${c.name}
    </button>
  `).join('');
  row.querySelectorAll('.class-btn').forEach(btn => {
    btn.addEventListener('click', () => selectClass(btn.dataset.slug));
  });
}

function racesFor(classSlug) {
  const allowed = state.chars.combos[classSlug] || [];
  return state.chars.races
    .map(r => ({ ...r, combo: allowed.find(c => c.race === r.id) }))
    .filter(r => r.combo);
}

function renderRaceSelect() {
  const sel = document.getElementById('raceSelect');
  const races = racesFor(state.loadout.class);
  sel.innerHTML = ['Alliance', 'Horde'].map(f => {
    const opts = races.filter(r => r.faction === f).map(r =>
      `<option value="${r.id}">${esc(r.name)}${r.combo.new ? ' (new)' : ''}</option>`).join('');
    return opts ? `<optgroup label="${f}">${opts}</optgroup>` : '';
  }).join('');
  if (!races.some(r => r.id === state.loadout.race)) state.loadout.race = races[0]?.id ?? null;
  sel.value = state.loadout.race;
}

function syncCharControls() {
  document.querySelectorAll('.class-btn').forEach(b => b.classList.toggle('active', b.dataset.slug === state.loadout.class));
  renderRaceSelect();
  document.getElementById('levelInput').value = state.loadout.level;
  document.getElementById('charSection').style.display = 'block';
  document.getElementById('builderSection').style.display = 'block';
}

function selectClass(slug) {
  if (slug === state.loadout.class) return;
  state.loadout.class = slug;
  // Gear stays equipped across class changes; the sheet flags what the new class can't use.
  syncCharControls();
  closeList();
  changed();
}

// ── equipping ──────────────────────────────────────────────────────────────
function slotDef(slot) { return state.slotDefs.find(s => s.slot === slot); }

function equip(slot, item) {
  const L = state.loadout.slots;
  if (L[slot] === item.id) { unequip(slot); return; }       // clicking the equipped item again takes it off
  if (item.unique) {
    const other = Object.keys(L).find(s => s !== slot && L[s] === item.id);
    if (other) { toast(`${item.name} is unique — it's already equipped in ${slotDef(other).label}.`); return; }
  }
  let note = '';
  const main = state.equipped.mainhand;
  if (slot === 'mainhand' && item.two_hand && L.offhand) {
    note = 'Off hand cleared — two-handers use both hands.';
    delete L.offhand; delete state.equipped.offhand;
  }
  if (slot === 'offhand' && main && main.two_hand) {
    note = 'Two-hander removed to make room for the off hand.';
    delete L.mainhand; delete state.equipped.mainhand;
  }
  L[slot] = item.id;
  state.equipped[slot] = item;
  toast(note);
  changed();
}

function unequip(slot) {
  delete state.loadout.slots[slot];
  delete state.equipped[slot];
  toast('');
  changed();
}

function renderPaperdoll() {
  const leftCol = ['head', 'neck', 'shoulder', 'back', 'chest', 'wrist', 'finger1', 'trinket1'];
  const rightCol = ['hands', 'waist', 'legs', 'feet', 'finger2', 'trinket2'];
  const weaponRow = ['mainhand', 'offhand', 'ranged'];

  const slotBtn = slot => {
    const def = slotDef(slot);
    const id = state.loadout.slots[slot];
    const it = state.equipped[slot];
    const issues = state.issues[slot] || [];
    const unavailable = id && !it;
    let inner;
    if (!id) {
      inner = `${iconImg(null)}<span class="slot-text"><span class="slot-label">${def.label}</span><span class="slot-empty">empty</span></span>`;
    } else if (unavailable) {
      inner = `${iconImg(null, undefined, '', 'unavailable-icon')}<span class="slot-text"><span class="slot-label">${def.label}</span><span class="slot-item" style="color:var(--alert)">Item unavailable (#${id})</span></span>`;
    } else {
      inner = `${iconImg(it.id, it.quality)}<span class="slot-text"><span class="slot-label">${def.label}</span><span class="slot-item" style="color:${QUALITY_COLORS[it.quality] || '#fff'}">${esc(it.name)}</span></span>`;
    }
    const warn = issues.length ? `<span class="warn-mark" title="${esc(issues.map(i => i.msg).join(' '))}">⚠</span>` : '';
    const off = id ? `<span class="unequip" data-unequip="${slot}" title="Unequip" role="button" aria-label="Unequip ${def.label}">✕</span>` : '';
    return `<button class="slot-btn${slot === state.selectedSlot ? ' active' : ''}${issues.length ? ' warn' : ''}" data-slot="${slot}">${inner}${warn}${off}</button>`;
  };

  const el = document.getElementById('paperdoll');
  el.innerHTML = `
    <div class="paperdoll-col">${leftCol.map(slotBtn).join('')}</div>
    <div class="paperdoll-col">${rightCol.map(slotBtn).join('')}</div>
    <div class="weapon-row">${weaponRow.map(slotBtn).join('')}</div>
  `;
  el.querySelectorAll('.slot-btn').forEach(btn => btn.addEventListener('click', e => {
    const off = e.target.closest('[data-unequip]');
    if (off) { e.stopPropagation(); unequip(off.dataset.unequip); return; }
    openList(btn.dataset.slot);
  }));
}

// ── slot item list ─────────────────────────────────────────────────────────
function closeList() {
  state.selectedSlot = null;
  document.getElementById('resultsSection').style.display = 'none';
}

async function openList(slot) {
  state.selectedSlot = slot;
  renderPaperdoll();
  const def = slotDef(slot);
  const className = state.classes.find(c => c.slug === state.loadout.class).name;
  document.getElementById('resultsLabel').textContent = `${className} — ${def.label}`;
  const section = document.getElementById('resultsSection');
  const results = document.getElementById('results');
  section.style.display = 'block';
  results.innerHTML = '<div class="hint-note">Loading…</div>';
  const L = state.loadout;
  try {
    state.listItems = await api(`items?class=${encodeURIComponent(L.class)}&slot=${encodeURIComponent(def.browse)}&race=${L.race}&level=${L.level}`);
  } catch (e) {
    results.innerHTML = `<div class="empty-note">Couldn't load items: ${esc(e.message)}</div>`;
    return;
  }
  renderList();
}

function renderList() {
  const results = document.getElementById('results');
  const slot = state.selectedSlot;
  const issues = state.issues[slot] || [];
  if (!state.listItems.length) {
    results.innerHTML = `<div class="empty-note">No items known for this slot yet.</div>`;
    return;
  }
  results.innerHTML =
    (issues.length ? `<div class="slot-issues">⚠ ${issues.map(i => esc(i.msg)).join(' ')}</div>` : '') +
    `<div class="hint-note" style="padding-top:0">Click an item to equip it (click again to take it off).</div>` +
    `<div class="item-list">${state.listItems.map(itemRow).join('')}</div>`;
  results.querySelectorAll('.item-name').forEach(btn => {
    btn.addEventListener('click', () => {
      const item = state.listItems.find(i => i.id === Number(btn.dataset.id));
      equip(slot, item);
    });
  });
  results.querySelectorAll('.info-btn').forEach(btn => btn.addEventListener('click', () => showDetail(btn.dataset.id)));
  results.querySelectorAll('.badge.changed').forEach(badge => {
    badge.addEventListener('click', e => { e.stopPropagation(); showDiff(badge.dataset.id); });
  });
}

function itemRow(item) {
  const color = QUALITY_COLORS[item.quality] || '#fff';
  let badge = '';
  if (item.change_status === 'new') badge = '<span class="badge new">New</span>';
  if (item.change_status === 'changed') badge = `<span class="badge changed" data-id="${item.id}">Changed</span>`;
  const flags = [];
  if (item.level_ok === false) flags.push(`<span class="flag">req ${item.required_level}</span>`);
  if (item.race_ok === false) flags.push(`<span class="flag">race</span>`);
  if (item.unique) flags.push(`<span class="flag dim">unique</span>`);
  if (item.two_hand) flags.push(`<span class="flag dim">2H</span>`);
  if (state.selectedSlot === 'offhand' && item.inventory_type === INVTYPE_ONE_HAND) flags.push(`<span class="flag dim">1H</span>`);
  const equipped = state.loadout.slots[state.selectedSlot] === item.id;
  return `
    <div class="item-row${equipped ? ' equipped' : ''}">
      ${iconImg(item.id, item.quality)}
      <button class="item-name" style="color:${color}" data-id="${item.id}">${esc(item.name)}</button>
      <span class="item-ilvl">ilvl ${item.item_level}${item.required_level ? ' · req ' + item.required_level : ''}</span>
      ${badge}${flags.join('')}
      <button class="info-btn" data-id="${item.id}" title="Tooltip">info</button>
    </div>
  `;
}

async function showDetail(id) {
  const results = document.getElementById('results');
  results.innerHTML = '<div class="hint-note">Loading…</div>';
  let item;
  try {
    item = await api(`item/${id}`);
  } catch (e) {
    results.innerHTML = `<div class="empty-note">Couldn't load item: ${esc(e.message)}</div>`;
    return;
  }

  const color = QUALITY_COLORS[item.quality] || '#fff';
  // WoW tooltip order: base armor first, then the stat lines.
  const armorHtml = item.armor ? `<li class="armor">${item.armor} Armor</li>` : '';
  const statsHtml = item.stats.length || armorHtml
    ? `<ul class="stat-list">${armorHtml}${statItems(item.stats)}</ul>`
    : '<p class="hint-note" style="padding:0 0 0.8rem;">No stats on this item.</p>';

  const obtain = `How to obtain this item is not yet known — item information is most likely datamined.`;

  results.innerHTML = `
    <div class="detail-panel">
      <button class="detail-back" id="detailBack">‹ Back to items</button>
      <div class="detail-head">
        ${iconImg(item.id, item.quality, 'lg')}
        <div>
          <div class="detail-name" style="color:${color}">${esc(item.name)}</div>
          <div class="detail-meta">
            ilvl ${item.item_level}${item.required_level ? ' · requires level ' + item.required_level : ''}
            ${item.material ? ' · ' + item.material : ''}
            ${item.change_status !== 'unchanged' ? ' · <span style="color:var(--gold)">' + item.change_status + ' vs Classic Era</span>' : ''}
          </div>
        </div>
      </div>
      ${statsHtml}
      <div class="obtain-box">${obtain}</div>
      <a class="wowhead-link" href="${item.wowhead_url}" target="_blank" rel="noopener">View on Wowhead →</a>
    </div>
  `;
  document.getElementById('detailBack').addEventListener('click', renderList);
}

async function showDiff(id) {
  let item;
  try {
    item = await api(`item/${id}`);
  } catch (e) {
    return;
  }
  const overlay = document.getElementById('modalOverlay');
  const body = document.getElementById('modalBody');
  document.getElementById('modalTitle').textContent = `${item.name} — changed vs Classic Era`;

  const fieldLabel = f => f === 'stats' ? 'Stats' : f.replace(/_/g, ' ');
  const renderSide = (diffEntry, side) => {
    const val = diffEntry[side];
    if (diffEntry.field === 'stats') {
      if (!val.length) return '<em style="color:var(--ink-dim)">none</em>';
      return val.map(statLine).join('<br>');
    }
    return String(val);
  };

  body.innerHTML = `
    <div class="diff-col-head">Classic Era</div>
    <div class="diff-col-head">Forever (beta)</div>
    ${(item.diff || []).map(d => `
      <div class="diff-field" style="grid-column:1 / -1;"><span class="diff-field-name">${fieldLabel(d.field)}</span></div>
      <div class="diff-field">${renderSide(d, 'classic')}</div>
      <div class="diff-field">${renderSide(d, 'forever')}</div>
    `).join('')}
  `;
  overlay.classList.remove('hidden');
}

// ── character sheet ────────────────────────────────────────────────────────
let sheetSeq = 0;

function changed() {
  state.dirty = true;
  if (state.savedId) document.getElementById('shareBox').classList.remove('show');
  renderPaperdoll();
  if (state.selectedSlot) renderList();
  refreshSheet();
}

async function refreshSheet() {
  const seq = ++sheetSeq;
  let data;
  try {
    data = await api('sheet', state.loadout);
  } catch (e) {
    document.getElementById('sheet').innerHTML = `<div class="empty-note">Couldn't compute the sheet: ${esc(e.message)}</div>`;
    return;
  }
  if (seq !== sheetSeq) return;  // a newer change is already in flight
  state.issues = {};
  for (const [slot, info] of Object.entries(data.slots)) {
    if (info.item) state.equipped[slot] = info.item; else delete state.equipped[slot];
    if (info.issues.length) state.issues[slot] = info.issues;
  }
  renderPaperdoll();
  if (state.selectedSlot && document.querySelector('.item-list')) renderList();
  renderSheet(data.sheet);
}

const ATTR_LABELS = { strength: 'Strength', agility: 'Agility', stamina: 'Stamina', intellect: 'Intellect', spirit: 'Spirit' };
const pct = v => v === null || v === undefined ? null : `${v.toFixed(2)}%`;

function row(label, value, title = '', gear = false) {
  if (value === null || value === undefined) return '';
  return `<div class="row"${title ? ` title="${esc(title)}"` : ''}><span>${label}</span><span class="v${gear ? ' gear' : ''}">${value}</span></div>`;
}

function renderSheet(s) {
  const c = s.combat;
  const attrs = Object.entries(s.attributes).map(([k, v]) =>
    row(ATTR_LABELS[k], v.total, `base ${v.base} + gear ${v.gear}`, v.gear > 0)).join('');
  const resists = Object.entries(s.resistances).map(([k, v]) => row(k[0].toUpperCase() + k.slice(1), v)).join('');
  const ratings = Object.entries(s.gear_ratings).map(([k, v]) => row(`+${esc(k)}`, v)).join('');
  const other = Object.entries(s.gear_other).map(([k, v]) => row(`+${esc(k)}`, v)).join('');
  document.getElementById('sheet').innerHTML = `
    ${s.provisional.map(p => `<div class="prov">Provisional: ${esc(p)}</div>`).join('')}
    <h3>Attributes <span class="estimated" style="color:var(--ink-dim)">(hover for base + gear)</span></h3>
    ${attrs}
    <h3>Vitals</h3>
    ${row('Health', s.health)}
    ${s.mana !== null ? row('Mana', s.mana) : row('Resource', s.resource)}
    ${row('Armor', s.armor.total, `items ${s.armor.items} + agility ${s.armor.agility}`)}
    <h3>Resistances</h3>
    ${resists}
    ${s.racials ? `<div class="note">Racial: ${esc(s.racials)}</div>` : ''}
    <h3>Combat <span class="estimated">— Estimated · unbuffed, no talents</span></h3>
    ${row('Attack power', c.melee_ap)}
    ${row('Ranged attack power', c.ranged_ap)}
    ${row('Melee crit', pct(c.melee_crit))}
    ${row('Ranged crit', pct(c.ranged_crit))}
    ${row('Spell crit', pct(c.spell_crit))}
    ${row('Dodge', pct(c.dodge))}
    ${row('Parry', pct(c.parry))}
    ${row('Block', pct(c.block))}
    ${row('Block value', c.block_value)}
    ${row('Defense', c.defense)}
    ${ratings || other ? `<h3>Other gear bonuses</h3>${ratings}${other}` : ''}
    <div class="note">
      Gear ratings (hit/crit/dodge…) aren't converted to % — Forever's rating table isn't known yet.
      Set bonuses not yet included. Weapon damage / DPS pending.
    </div>
  `;
}

// ── save / load ────────────────────────────────────────────────────────────
async function saveSet() {
  const btn = document.getElementById('saveBtn');
  btn.disabled = true;
  try {
    const res = await api('set', state.loadout);
    state.savedId = res.id;
    state.dirty = false;
    const url = new URL(res.path, document.baseURI.replace(/gear\/$/, '')).href;
    history.replaceState(null, '', url);
    document.getElementById('shareUrl').value = url;
    document.getElementById('shareBox').classList.add('show');
    toast('');
  } catch (e) {
    toast(`Couldn't save: ${e.message}`);
  } finally {
    btn.disabled = false;
  }
}

async function loadFromUrl() {
  const m = location.pathname.match(/\/gear\/set\/([A-Za-z0-9]+)\/?$/);
  if (!m) return false;
  try {
    const loadout = await api(`set/${m[1]}`);
    state.loadout = { class: loadout.class, race: loadout.race, level: loadout.level, slots: loadout.slots || {} };
    state.savedId = m[1];
    syncCharControls();
    // Loaded as-is (race is kept even if the class no longer offers it — the sheet says so).
    renderPaperdoll();
    await refreshSheet();
    state.dirty = false;
    document.getElementById('shareUrl').value = location.href;
    document.getElementById('shareBox').classList.add('show');
    return true;
  } catch (e) {
    toast(`Couldn't load that set: ${e.message}`);
    return false;
  }
}

// ── wiring ─────────────────────────────────────────────────────────────────
document.getElementById('raceSelect').addEventListener('change', e => {
  state.loadout.race = Number(e.target.value);
  if (state.selectedSlot) openList(state.selectedSlot);
  changed();
});
document.getElementById('levelInput').addEventListener('change', e => {
  const lvl = Math.max(1, Math.min(state.chars.max_level, Math.round(Number(e.target.value)) || 60));
  e.target.value = lvl;
  state.loadout.level = lvl;
  if (state.selectedSlot) openList(state.selectedSlot);
  changed();
});
document.getElementById('saveBtn').addEventListener('click', saveSet);
document.getElementById('clearBtn').addEventListener('click', () => {
  state.loadout.slots = {}; state.equipped = {}; toast(''); changed();
});
document.getElementById('copyBtn').addEventListener('click', () => {
  const input = document.getElementById('shareUrl');
  input.select();
  navigator.clipboard?.writeText(input.value).then(() => toast('Link copied.'), () => {});
});
document.getElementById('modalClose').addEventListener('click', () => document.getElementById('modalOverlay').classList.add('hidden'));
document.getElementById('modalOverlay').addEventListener('click', e => {
  if (e.target.id === 'modalOverlay') e.currentTarget.classList.add('hidden');
});

(async function init() {
  try {
    const [meta, classes, chars] = await Promise.all([api('meta'), api('classes'), api('characters')]);
    renderBanner(meta);
    state.classes = classes;
    state.chars = chars;
    state.slotDefs = chars.slots;
    renderClasses();
  } catch (e) {
    document.getElementById('banner').innerHTML =
      `<strong>Couldn't load build info</strong> — ${esc(e.message)}. Has the ingest run yet? (<code>python -m ingest.run</code>)`;
    return;
  }
  await loadFromUrl();
})();
</script>
</body>
