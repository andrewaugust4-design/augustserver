<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quest Browser — WoW: Forever</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1b160e;
    --panel: #251e12;
    --panel-edge: #3d331d;
    --ink: #f0e6d2;
    --ink-dim: #a89878;
    --gold: #e0a82e;
    --gold-dim: #8a6b1f;
    --alert: #e2604c;
    --ok: #8fc79a;
    --new: #34d399;
    --alliance: #6aa5ff;
    --horde: #ff6b5b;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
    --sans: "Space Grotesk", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--ink); font-family: var(--sans); min-height: 100vh; padding: 2rem 1.25rem 4rem; }
  .wrap { max-width: 1100px; margin: 0 auto; }

  .back-link {
    display: inline-flex; align-items: center; gap: 0.45rem;
    font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--ink-dim); text-decoration: none;
    border: 1px solid var(--panel-edge); border-radius: 6px;
    padding: 0.45rem 0.85rem; margin-bottom: 1.25rem; transition: color 0.15s, border-color 0.15s;
  }
  .back-link:hover { color: var(--gold); border-color: var(--gold); }
  h1 { font-size: clamp(1.6rem, 4vw, 2.1rem); font-weight: 700; letter-spacing: -0.01em; margin-bottom: 0.9rem; }
  h1 .accent { color: var(--gold); }

  .banner {
    background: rgba(224, 168, 46, 0.08); border: 1px solid rgba(224, 168, 46, 0.35); border-radius: 10px;
    padding: 0.75rem 1rem; margin-bottom: 1.5rem; font-size: 0.78rem; line-height: 1.55;
  }
  .banner strong { color: var(--gold); }
  .banner .meta-line { display: block; margin-top: 0.3rem; font-family: var(--mono); font-size: 0.68rem; color: var(--ink-dim); }

  .filters { display: flex; flex-wrap: wrap; gap: 0.6rem 0.9rem; align-items: flex-end; margin-bottom: 1rem; }
  .field { display: flex; flex-direction: column; gap: 0.3rem; }
  .field label { font-family: var(--mono); font-size: 0.64rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-dim); }
  select, input[type=number], input[type=search] {
    font-family: var(--sans); font-size: 0.85rem; color: var(--ink); background: var(--panel);
    border: 1px solid var(--panel-edge); border-radius: 8px; padding: 0.45rem 0.6rem;
  }
  input[type=number] { width: 4.6rem; }
  input[type=search] { width: 14rem; }
  .check { display: flex; align-items: center; gap: 0.4rem; font-size: 0.82rem; color: var(--ink-dim); padding-bottom: 0.45rem; }
  .count { font-family: var(--mono); font-size: 0.72rem; color: var(--ink-dim); margin-bottom: 0.5rem; }

  .layout { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 1.2rem; align-items: start; }
  @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }

  table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
  th {
    text-align: left; font-family: var(--mono); font-size: 0.64rem; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--ink-dim); font-weight: 500; padding: 0.45rem 0.5rem; border-bottom: 1px solid var(--panel-edge);
  }
  th.sortable { cursor: pointer; }
  th.sortable:hover, th.sorted { color: var(--gold); }
  td { padding: 0.45rem 0.5rem; border-bottom: 1px solid rgba(255,255,255,0.04); vertical-align: top; }
  tr.q { cursor: pointer; }
  tr.q:hover td { background: rgba(224,168,46,0.05); }
  tr.q.sel td { background: rgba(224,168,46,0.1); }
  .qname { font-weight: 500; }
  .qname.unknown { color: var(--ink-dim); font-style: italic; font-weight: 400; }
  .sub { font-size: 0.72rem; color: var(--ink-dim); }
  .lvl { font-family: var(--mono); white-space: nowrap; }
  .fac { font-family: var(--mono); font-size: 0.7rem; }
  .fac.alliance { color: var(--alliance); }
  .fac.horde { color: var(--horde); }
  .fac.both { color: var(--ink-dim); }
  .badge {
    font-family: var(--mono); font-size: 0.6rem; letter-spacing: 0.05em; text-transform: uppercase; white-space: nowrap;
    padding: 0.12rem 0.45rem; border-radius: 999px; color: var(--new); border: 1px solid var(--new); background: rgba(52,211,153,0.1);
  }
  .more { margin: 0.9rem 0; }
  .btn {
    font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase;
    padding: 0.55rem 0.9rem; border-radius: 8px; cursor: pointer;
    background: rgba(224,168,46,0.12); border: 1px solid var(--gold-dim); color: var(--gold);
  }
  .btn:hover { border-color: var(--gold); }
  .empty { font-size: 0.85rem; color: var(--ink-dim); padding: 0.8rem 0; }

  .detail { position: sticky; top: 1rem; background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 12px; padding: 1.1rem 1.2rem; font-size: 0.84rem; line-height: 1.55; }
  .detail h2 { font-size: 1.1rem; margin-bottom: 0.25rem; }
  .detail .meta { font-family: var(--mono); font-size: 0.7rem; color: var(--ink-dim); margin-bottom: 0.8rem; }
  .detail h3 { font-family: var(--mono); font-size: 0.64rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-dim); font-weight: 500; margin: 0.9rem 0 0.3rem; }
  .detail p { white-space: pre-line; }
  .detail .note { font-size: 0.76rem; color: var(--ink-dim); background: rgba(255,255,255,0.03); border: 1px solid var(--panel-edge); border-radius: 8px; padding: 0.55rem 0.7rem; margin-top: 0.8rem; }
  .detail .pending { color: var(--gold); }
  .qlink { color: var(--gold); cursor: pointer; text-decoration: underline; text-decoration-color: var(--gold-dim); }
  .wowhead { display: inline-block; margin-top: 0.9rem; font-family: var(--mono); font-size: 0.76rem; color: var(--gold); text-decoration: none; }
  .wowhead:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back-link" href="..">‹ WoW: Forever</a>
  <h1>Quest <span class="accent">Browser</span></h1>
  <div class="banner" id="banner">Loading build info…</div>

  <div class="filters">
    <div class="field"><label for="q">Search</label><input id="q" type="search" placeholder="Name or quest id"></div>
    <div class="field"><label for="zone">Zone</label><select id="zone"><option value="">All zones</option></select></div>
    <div class="field"><label for="minLevel">Req. level</label>
      <span><input id="minLevel" type="number" min="0" max="60" placeholder="min"> – <input id="maxLevel" type="number" min="0" max="60" placeholder="max"></span></div>
    <div class="field"><label for="faction">Faction</label>
      <select id="faction">
        <option value="">Any</option>
        <option value="alliance">Alliance (incl. shared)</option>
        <option value="horde">Horde (incl. shared)</option>
        <option value="both">Shared only</option>
      </select></div>
    <label class="check"><input type="checkbox" id="newOnly"> New to Forever only</label>
    <label class="check" title="Carryover quest ids from the client that the 1.12 reference doesn't know"><input type="checkbox" id="unknown"> Include unidentified carryover ids</label>
  </div>

  <div class="count" id="count"></div>
  <div class="layout">
    <div>
      <table>
        <thead><tr>
          <th class="sortable" data-sort="name">Quest</th>
          <th class="sortable sorted" data-sort="zone">Zone</th>
          <th class="sortable" data-sort="level">Level</th>
          <th>Faction</th>
          <th></th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="more" id="more"></div>
    </div>
    <div class="detail" id="detail"><div class="empty">Select a quest to see its details.</div></div>
  </div>
</div>

<script>
const state = { sort: 'zone', page: 1, total: 0, rows: [], selected: null, seq: 0 };
const PER_PAGE = 100;

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function api(path) {
  const res = await fetch('../api/' + path);
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || res.statusText);
  return res.json();
}

const FACTION_LABEL = { alliance: 'Alliance', horde: 'Horde', both: 'Both' };

function filters() {
  const p = new URLSearchParams();
  const v = id => document.getElementById(id).value.trim();
  if (v('q')) p.set('q', v('q'));
  if (v('zone')) p.set('zone', v('zone'));
  if (v('minLevel') !== '') p.set('min_level', v('minLevel'));
  if (v('maxLevel') !== '') p.set('max_level', v('maxLevel'));
  if (v('faction')) p.set('faction', v('faction'));
  if (document.getElementById('newOnly').checked) p.set('forever', 'new');
  if (document.getElementById('unknown').checked) p.set('include_unknown', 'true');
  p.set('sort', state.sort);
  p.set('per_page', PER_PAGE);
  return p;
}

function questName(r) {
  return r.name ? esc(r.name) : `<span class="qname unknown">Quest #${r.id} — not yet revealed</span>`;
}

function rowHtml(r) {
  const lvl = r.req_level == null ? '<span class="sub">?</span>'
    : `${r.req_level}${r.quest_level && r.quest_level !== r.req_level ? `<span class="sub"> (${r.quest_level})</span>` : ''}`;
  const zone = r.zone ? `${esc(r.zone)}${r.subzone ? `<div class="sub">${esc(r.subzone)}</div>` : ''}` : '<span class="sub">Unknown</span>';
  const fac = r.faction ? `<span class="fac ${r.faction}">${FACTION_LABEL[r.faction]}</span>` : '<span class="sub">?</span>';
  return `<tr class="q${state.selected === r.id ? ' sel' : ''}" data-id="${r.id}">
    <td><span class="qname">${questName(r)}</span></td>
    <td>${zone}</td>
    <td class="lvl">${lvl}</td>
    <td>${fac}</td>
    <td>${r.status === 'new' ? '<span class="badge">New to Forever</span>' : ''}</td>
  </tr>`;
}

function render() {
  document.getElementById('rows').innerHTML = state.rows.map(rowHtml).join('') ||
    '<tr><td colspan="5" class="empty">No quests match these filters.</td></tr>';
  document.querySelectorAll('tr.q').forEach(tr => tr.addEventListener('click', () => showQuest(Number(tr.dataset.id))));
  document.getElementById('count').textContent = `${state.total.toLocaleString()} quests · showing ${state.rows.length.toLocaleString()}`;
  const more = document.getElementById('more');
  more.innerHTML = state.rows.length < state.total ? '<button class="btn" id="moreBtn">Load more</button>' : '';
  document.getElementById('moreBtn')?.addEventListener('click', () => load(state.page + 1));
  document.querySelectorAll('th.sortable').forEach(th => th.classList.toggle('sorted', th.dataset.sort === state.sort));
}

async function load(page = 1) {
  const seq = ++state.seq;
  const p = filters();
  p.set('page', page);
  let data;
  try {
    data = await api('quests?' + p.toString());
  } catch (e) {
    document.getElementById('rows').innerHTML = `<tr><td colspan="5" class="empty">Couldn't load quests: ${esc(e.message)}</td></tr>`;
    return;
  }
  if (seq !== state.seq) return;  // a newer filter change won
  state.page = page;
  state.total = data.total;
  state.rows = page === 1 ? data.rows : state.rows.concat(data.rows);
  render();
}

function chainLink(q, label) {
  if (!q) return '';
  const name = q.name ? esc(q.name) : `Quest #${q.id}`;
  return `<div>${label}: <span class="qlink" data-id="${q.id}">${name}</span></div>`;
}

async function showQuest(id) {
  state.selected = id;
  document.querySelectorAll('tr.q').forEach(tr => tr.classList.toggle('sel', Number(tr.dataset.id) === id));
  const el = document.getElementById('detail');
  el.innerHTML = '<div class="empty">Loading…</div>';
  let q;
  try {
    q = await api(`quest/${id}`);
  } catch (e) {
    el.innerHTML = `<div class="empty">Couldn't load quest: ${esc(e.message)}</div>`;
    return;
  }
  const meta = [
    q.zone ? esc(q.zone) + (q.subzone ? ` · ${esc(q.subzone)}` : '') : 'Zone unknown',
    q.req_level != null ? `requires level ${q.req_level}` : null,
    q.quest_level ? `quest level ${q.quest_level}` : null,
    q.faction ? FACTION_LABEL[q.faction] : null,
    q.classes.length ? q.classes.join('/') + ' only' : null,
  ].filter(Boolean).join(' · ');

  let body;
  if (!q.revealed) {
    body = `
      ${q.quest_line ? `<h3>Quest line</h3><p>${esc(q.quest_line)} — step ${q.quest_line_step}</p>` : ''}
      <div class="note"><span class="pending">Not yet revealed</span> — quest names, levels and text are server-side,
        so this ${q.status === 'new' ? 'new Forever quest' : 'quest id'} fills in only once it's seen in-world.
        The client confirms it exists${q.zone ? ` and places it in ${esc(q.zone)}` : ''}.</div>`;
  } else {
    body = `
      ${q.objectives ? `<h3>Objectives</h3><p>${esc(q.objectives)}</p>` : ''}
      ${q.objective_texts.length ? `<ul style="margin:0.3rem 0 0 1.1rem">${q.objective_texts.map(t => `<li>${esc(t)}</li>`).join('')}</ul>` : ''}
      ${q.details ? `<h3>Description</h3><p>${esc(q.details)}</p>` : ''}
      ${q.prev_quest || q.next_quest ? `<h3>Chain</h3>
        ${chainLink(q.prev_quest, q.prev_is_active ? 'Must be on' : 'Follows')}
        ${chainLink(q.next_quest, 'Leads to')}` : ''}
      ${q.quest_line ? `<h3>Quest line</h3><p>${esc(q.quest_line)} — step ${q.quest_line_step}</p>` : ''}
      <h3>Rewards</h3><p class="pending">Pending — rewards are server-side in Forever.</p>
      <div class="note">Details from the vanilla 1.12 quest reference${q.in_client ? '' : ' (this quest isn\'t in the client\'s quest list, e.g. a repeatable)'}.
        Forever may have changed it server-side.</div>`;
  }
  el.innerHTML = `
    <h2>${q.name ? esc(q.name) : `Quest #${q.id}`} ${q.status === 'new' ? '<span class="badge">New to Forever</span>' : ''}</h2>
    <div class="meta">${meta}</div>
    ${body}
    <a class="wowhead" href="${q.wowhead_url}" target="_blank" rel="noopener">Full text on Wowhead →</a>`;
  el.querySelectorAll('.qlink').forEach(a => a.addEventListener('click', () => showQuest(Number(a.dataset.id))));
}

let debounce;
function refilter() {
  clearTimeout(debounce);
  debounce = setTimeout(() => load(1), 200);
}
['q', 'minLevel', 'maxLevel'].forEach(id => document.getElementById(id).addEventListener('input', refilter));
['zone', 'faction', 'newOnly', 'unknown'].forEach(id => document.getElementById(id).addEventListener('change', () => load(1)));
document.querySelectorAll('th.sortable').forEach(th => th.addEventListener('click', () => { state.sort = th.dataset.sort; load(1); }));

(async function init() {
  try {
    const [meta, zones] = await Promise.all([api('quests/meta'), api('quests/zones')]);
    const refreshed = meta.refreshed_at ? new Date(meta.refreshed_at).toUTCString().replace('GMT', 'UTC') : 'unknown';
    document.getElementById('banner').innerHTML =
      `<strong>Beta data</strong> — Forever build ${esc(meta.forever_build)} vs Classic Era ${esc(meta.classic_era_build)}. ` +
      `The client only lists quest <em>ids</em>: that's how the ${meta.new_count.toLocaleString()} "New to Forever" quests are found, ` +
      `but their names, levels and text are server-side and not yet revealed. Carryover quest details come from the vanilla 1.12 quest reference. ` +
      `Rewards are pending.` +
      `<span class="meta-line">${meta.classic_detailed.toLocaleString()} carryover quests with details · ${meta.new_count.toLocaleString()} new · refreshed ${refreshed}</span>`;
    document.getElementById('zone').innerHTML += zones.map(z =>
      `<option value="${esc(z.zone)}">${esc(z.zone)} (${z.count}${z.new ? `, ${z.new} new` : ''})</option>`).join('');
  } catch (e) {
    document.getElementById('banner').innerHTML = `<strong>Couldn't load quest data</strong> — ${esc(e.message)}. Has the ingest run yet?`;
    return;
  }
  load(1);
})();
</script>
</body>
</html>
