# Add inside your existing server { ... } block for augustserver.com.
# The tool then lives at https://augustserver.com/drop/

location = /drop {
    return 301 /drop/;
}

location /drop/ {
    proxy_pass http://127.0.0.1:8062/;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Keep in sync with MAX_UPLOAD_MB in .env
    client_max_body_size 200M;

    # Large uploads/downloads on slow connections need generous timeouts
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    # Stream uploads straight to the app instead of buffering to disk twice
    proxy_request_buffering off;
}
